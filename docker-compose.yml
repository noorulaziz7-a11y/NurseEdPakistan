version: "3.9"

services:
  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - ./env/docker.env
    depends_on:
      - db
      - redis
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nursing
      POSTGRES_PASSWORD: nursing
      POSTGRES_DB: nursing_educator
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pg_data:
